name: Petstore API Testing Agent

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Strict quality gate or exploratory demo run'
        type: choice
        options:
          - strict
          - exploratory
        default: strict

permissions:
  contents: read

concurrency:
  group: petstore-api-agent
  cancel-in-progress: false

jobs:
  api-tests:
    name: Run Petstore API Agent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AGENT_MODE: ${{ inputs.mode }}
      PETSTORE_BASE_URL: https://petstore3.swagger.io/api/v3
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-4.1-mini

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run API testing agent
        run: python agent.py

      - name: Upload JSON and HTML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: petstore-api-agent-report
          path: reports/
          if-no-files-found: warn
          retention-days: 14
